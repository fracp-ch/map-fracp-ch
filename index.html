<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>FRACP - Carte intéractive de mise en réseaux</title>
    <link rel="stylesheet" media="all" href="https://map.ernte-teilen.org/main.css">

    <style>
      html, body, main {
        width: 100%;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }

      header {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 1000;
        width: 100%;
        height: 75px;
        background-color: white;
      }

      header nav {
        height: 100%;
        margin: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        font-size: 28px;
        font-weight: 400;
        color: #215334;
        display: none;
      }

      @media (min-width: 760px) {
        header nav {
          margin: 0 20px;
        }

        header h1 {
          display: block;
        }
      }

      a.logo img {
        margin-top: 7px;
      }

      .nav-contact-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 500;
        font-size: 14px;
        color: #215334;
        padding: 6px 12px;
        border: 2px solid #215334;
        border-radius: 8px;
        text-decoration: none;
        transition: color 0.2s, background-color 0.2s, border-color 0.2s;
      }

      .nav-contact-btn:hover {
        background-color: #215334;
        color: white;
      }

      .nav-contact-btn svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        margin-top: 1px;
      }


      #teikei-app {
        display: block;
        width: 100%;
        min-height: 100vh;
        background-color: #397766;
      }

      .teikei-embed .user-nav {
        top: 200px !important;
      }

      .teikei-embed .entries-nav, .teikei-embed .account-nav, .teikei-embed .account-nav-login {
        right: 20px !important;
      }

      .teikei-embed .button-help {
        right: initial !important;
        left: 30px !important;
      }

      .teikei-embed .entries-nav {
        top: 85px !important;
      }

      @media (min-width: 760px) {
        .teikei-embed .user-nav {
          top: 90px !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a class="logo" href="https://fracp.ch">
          <img src="https://map.fracp.ch/assets/logo.png" alt="FRACP Logo" height="45"/>
        </a>
        <h1>Plateforme de mise en réseau</h1>
        <a href="mailto:info@fracp.ch" class="nav-contact-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <span>info@fracp.ch</span>
        </a>
      </nav>
    </header>
    <noscript>Vous devez activer JavaScript pour exécuter cette application.</noscript>
    <div
      id="teikei-app"
      data-base-url="/#"
      data-country="CH-fr"
      data-external-help-url="https://fracp.ch/carte"
      data-api-base-url="https://api.ernte-teilen.org"
      data-assets-base-url="https://map.ernte-teilen.org/assets"
      data-display-locale="fr-CH"
      data-user-communication-locale="fr-CH"
    ></div>
    <script src="https://map.ernte-teilen.org/main.js"></script>
  </body>
</html>
